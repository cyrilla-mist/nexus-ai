name: Apply Canonical Verity Scenario

on:
  push:
    branches:
      - repair/nexus-atlas-integration-v1
    paths:
      - scripts/apply-canonical-verity-scenario.mjs
      - .github/workflows/apply-canonical-verity-scenario.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/nexus-atlas-integration-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical scenario migration
        run: node scripts/apply-canonical-verity-scenario.mjs

      - name: Validate canonical scenario and asset identity
        run: |
          npm test
          npm run check
          npm run build:verity-scenario
          npm run verify:verity-continuity
          npm run verify:verity-datahub
          npm run verify:verity-ingestion
          git diff --check

      - name: Commit canonical scenario migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            continuity/scenarios \
            experience/continuity/fixture-continuity-provider.mjs \
            datahub/verity/load-verity-scenario.mjs \
            datahub/verity/asset-registry.mjs \
            datahub/scripts/ingest_verity_assets.py \
            frontend/atlas/atlas-app.js \
            scripts/build-verity-reentry-scenario.mjs \
            tests/verity-continuity-provider.test.mjs \
            README.md docs examples
          git commit -m "refactor: canonicalize Verity scenario and calibration context"
          git push origin HEAD:repair/nexus-atlas-integration-v1
