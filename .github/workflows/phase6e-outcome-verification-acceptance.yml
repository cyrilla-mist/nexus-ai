name: Phase 6E Outcome Verification Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/continuity-loop-v01/outcome-verifier.mjs'
      - 'tests/outcome-verification-v01.test.mjs'
      - 'tests/outcome-verification-commit-postcondition-v01.test.mjs'
      - 'docs/Nexus-Atlas-v0.1-Outcome-Verification-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Outcome-Verification-Test-Matrix.md'
      - '.github/workflows/phase6e-outcome-verification-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: node --version

      - name: Phase 6E syntax boundary
        run: |
          node --check experience/continuity-loop-v01/outcome-verifier.mjs
          node --check tests/outcome-verification-v01.test.mjs
          node --check tests/outcome-verification-commit-postcondition-v01.test.mjs

      - name: Dedicated outcome-verification acceptance
        run: node --test tests/outcome-verification-v01.test.mjs tests/outcome-verification-commit-postcondition-v01.test.mjs

      - name: Phase 6D frozen regression
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6C Continuity Assessment regression
        run: node --test tests/continuity-assessment-v01.test.mjs

      - name: Fresh Evidence Window regression
        run: node --test tests/fresh-evidence-window-v01.test.mjs

      - name: Phase 6B frozen regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
