name: Phase 5 Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment
        run: |
          node --version
          npm --version
          python --version
          git --version

      - name: Phase 5F dedicated acceptance
        run: npm run verify:phase5-v01

      - name: Full Node test suite
        run: npm test

      - name: Full repository check
        run: npm run check

      - name: Phase 4F frozen regression
        run: npm run verify:phase4-v01
