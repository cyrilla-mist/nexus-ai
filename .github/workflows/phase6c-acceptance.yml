name: Phase 6C Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/continuity-loop-v01/github-commit-range-proof.mjs'
      - 'experience/continuity-loop-v01/fresh-evidence-window.mjs'
      - 'tests/fresh-evidence-window-v01.test.mjs'
      - 'docs/Nexus-Atlas-v0.1-Fresh-Evidence-Window-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Fresh-Evidence-Window-Test-Matrix.md'
      - '.github/workflows/phase6c-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: node --version

      - name: Phase 6C syntax boundary
        run: |
          node --check experience/continuity-loop-v01/github-commit-range-proof.mjs
          node --check experience/continuity-loop-v01/fresh-evidence-window.mjs
          node --check tests/fresh-evidence-window-v01.test.mjs

      - name: Phase 6C dedicated acceptance
        run: node --test tests/fresh-evidence-window-v01.test.mjs

      - name: Phase 6B frozen regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
