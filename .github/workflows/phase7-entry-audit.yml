name: Phase 7 Entry Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit.md'
      - 'docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit-Matrix.md'
      - '.github/workflows/phase7-entry-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate 7A documentation boundary
        shell: bash
        run: |
          grep -F '**Status:** Complete — implementation entry decision' docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit.md
          grep -F '7B — Write-back Target + Policy Gate' docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit.md
          grep -F '**Status:** Binding 7A audit acceptance matrix' docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit-Matrix.md
          grep -F 'Passing 7A authorizes **7B — Write-back Target + Policy Gate** only.' docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit-Matrix.md

      - name: Enforce audit-only changed scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --depth=1
          allowed='^(docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit\.md|docs/Nexus-Atlas-Phase7-Writeback-Generalization-Entry-Audit-Matrix\.md|\.github/workflows/phase7-entry-audit\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo '7A audit branch modified files outside the allowed audit scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Phase 6B checkpoint persistence regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 6C fresh evidence and assessment regression
        run: node --test tests/fresh-evidence-window-v01.test.mjs tests/continuity-assessment-v01.test.mjs

      - name: Phase 6D authority and re-entry regression
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6E outcome verification regression
        run: node --test tests/outcome-verification-v01.test.mjs

      - name: Phase 6F continuity closure regression
        run: node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
