name: Cleanup Legacy Atlas Loader

on:
  push:
    branches:
      - repair/nexus-atlas-integration-v1
    paths:
      - scripts/cleanup-legacy-atlas-loader.mjs
      - .github/workflows/cleanup-legacy-atlas-loader.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/nexus-atlas-integration-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove legacy Atlas loader
        run: node scripts/cleanup-legacy-atlas-loader.mjs

      - name: Validate repository without legacy loader
        run: |
          npm test
          npm run check
          npm run verify:atlas
          npm run verify:verity-continuity
          npm run verify:verity-ingestion
          git diff --check

      - name: Commit loader removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/atlas/atlas.js frontend/atlas/source
          git commit -m "refactor: remove legacy Atlas Blob loader"
          git push origin HEAD:repair/nexus-atlas-integration-v1
