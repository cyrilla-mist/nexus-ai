name: Phase 8A Continuity Product Surface

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/product-surface-v01/continuity-product-surface-projector.mjs'
      - 'tests/continuity-product-surface-v01.test.mjs'
      - 'docs/Nexus-Atlas-Phase8-Continuity-Product-Surface-Entry-Audit.md'
      - 'docs/Nexus-Atlas-v0.1-Continuity-Product-Surface-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Continuity-Product-Surface-Test-Matrix.md'
      - '.github/workflows/phase8a-continuity-product-surface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-product-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 8A syntax boundary
        run: |
          node --check experience/product-surface-v01/continuity-product-surface-projector.mjs
          node --check tests/continuity-product-surface-v01.test.mjs

      - name: Dedicated Phase 8A acceptance
        run: node --test tests/continuity-product-surface-v01.test.mjs

      - name: Enforce bounded Phase 8A changed scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --depth=1
          allowed='^(experience/product-surface-v01/continuity-product-surface-projector\.mjs|tests/continuity-product-surface-v01\.test\.mjs|docs/Nexus-Atlas-Phase8-Continuity-Product-Surface-Entry-Audit\.md|docs/Nexus-Atlas-v0\.1-Continuity-Product-Surface-(Contract|Test-Matrix)\.md|\.github/workflows/phase8a-continuity-product-surface\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Phase 8A modified files outside the accepted bounded scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Phase 7G management surface regression
        run: node --test tests/writeback-management-surface-v01.test.mjs

      - name: Phase 7F Cross-source Verification regression
        run: node --test tests/cross-source-postcondition-v01.test.mjs

      - name: Phase 7E Outcome category regression
        run: node --test tests/writeback-outcome-category-v01.test.mjs

      - name: Phase 7D history/retention regression
        run: node --test tests/writeback-history-retention-v01.test.mjs

      - name: Phase 7C D1 durable write-back regression
        run: node --test tests/cloudflare-d1-writeback-v01.test.mjs

      - name: Phase 7B target/policy regression
        run: node --test tests/writeback-target-policy-v01.test.mjs

      - name: Phase 6 checkpoint/assessment/outcome regression
        run: |
          node --test tests/trusted-checkpoint-v01.test.mjs
          node --test tests/continuity-assessment-v01.test.mjs
          node --test tests/outcome-verification-v01.test.mjs
          node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
