name: Cleanup Repair Migration Scaffolding

on:
  push:
    branches:
      - repair/nexus-atlas-integration-v1
    paths:
      - scripts/cleanup-repair-migrations.mjs
      - .github/workflows/cleanup-repair-migrations.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/nexus-atlas-integration-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove one-time migration files
        run: node scripts/cleanup-repair-migrations.mjs

      - name: Validate cleaned repository
        run: |
          npm test
          npm run check
          npm run verify:atlas
          npm run verify:security-contracts
          npm run verify:context-package
          npm run verify:capability-registry
          npm run verify:verity-continuity
          npm run verify:verity-datahub
          npm run verify:verity-ingestion
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows scripts
          git commit -m "chore: remove one-time Atlas repair migrations"
          git push origin HEAD:repair/nexus-atlas-integration-v1
