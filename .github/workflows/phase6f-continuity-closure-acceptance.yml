name: Phase 6F Continuity Closure Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/continuity-loop-v01/continuity-closure.mjs'
      - 'experience/continuity-loop-v01/outcome-record-store.mjs'
      - 'experience/continuity-loop-v01/file-outcome-record-store.mjs'
      - 'tests/continuity-closure-v01.test.mjs'
      - 'docs/Nexus-Atlas-v0.1-Continuity-Closure-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Continuity-Closure-Test-Matrix.md'
      - '.github/workflows/phase6f-continuity-closure-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: node --version

      - name: Phase 6F syntax boundary
        run: |
          node --check experience/continuity-loop-v01/outcome-record-store.mjs
          node --check experience/continuity-loop-v01/file-outcome-record-store.mjs
          node --check experience/continuity-loop-v01/continuity-closure.mjs
          node --check tests/continuity-closure-v01.test.mjs

      - name: Dedicated continuity-closure acceptance
        run: node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 6E frozen regression
        run: node --test tests/outcome-verification-v01.test.mjs

      - name: Phase 6D frozen regression
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6C Continuity Assessment regression
        run: node --test tests/continuity-assessment-v01.test.mjs

      - name: Fresh Evidence Window regression
        run: node --test tests/fresh-evidence-window-v01.test.mjs

      - name: Phase 6B frozen regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
