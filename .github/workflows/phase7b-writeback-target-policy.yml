name: Phase 7B Write-back Target Policy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/writeback-v01/**'
      - 'tests/writeback-target-policy-v01.test.mjs'
      - 'docs/Nexus-Atlas-v0.1-Writeback-Target-Policy-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Writeback-Target-Policy-Test-Matrix.md'
      - '.github/workflows/phase7b-writeback-target-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writeback-target-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 7B syntax boundary
        run: |
          node --check experience/writeback-v01/writeback-target-validator.mjs
          node --check experience/writeback-v01/writeback-policy.mjs
          node --check experience/writeback-v01/writeback-capability-gate.mjs
          node --check experience/writeback-v01/phase6-store-target-adapter.mjs
          node --check tests/writeback-target-policy-v01.test.mjs

      - name: Dedicated Phase 7B acceptance
        run: node --test tests/writeback-target-policy-v01.test.mjs

      - name: Enforce bounded Phase 7B changed scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --depth=1
          allowed='^(experience/writeback-v01/(writeback-target-validator|writeback-policy|writeback-capability-gate|phase6-store-target-adapter)\.mjs|tests/writeback-target-policy-v01\.test\.mjs|docs/Nexus-Atlas-v0\.1-Writeback-Target-Policy-(Contract|Test-Matrix)\.md|\.github/workflows/phase7b-writeback-target-policy\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Phase 7B modified files outside the accepted bounded scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Phase 6B checkpoint persistence regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 6C fresh evidence and assessment regression
        run: node --test tests/fresh-evidence-window-v01.test.mjs tests/continuity-assessment-v01.test.mjs

      - name: Phase 6D authority and re-entry regression
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6E outcome verification regression
        run: node --test tests/outcome-verification-v01.test.mjs

      - name: Phase 6F continuity closure regression
        run: node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
