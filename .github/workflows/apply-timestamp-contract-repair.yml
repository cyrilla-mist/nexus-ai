name: Apply Timestamp Contract Repair

on:
  push:
    branches:
      - repair/nexus-atlas-integration-v1
    paths:
      - scripts/apply-timestamp-contract-repair.mjs
      - .github/workflows/apply-timestamp-contract-repair.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/nexus-atlas-integration-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic migration
        run: node scripts/apply-timestamp-contract-repair.mjs

      - name: Validate migrated contracts
        run: |
          npm test
          npm run check
          npm run verify:verity-continuity

      - name: Commit migrated files
        run: |
          if git diff --quiet; then
            echo "No timestamp migration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience/continuity/normalize-continuity-scenario.mjs \
            experience/continuity/reentry-view-model.mjs \
            tests/verity-continuity-provider.test.mjs
          git commit -m "fix: preserve project update and re-entry timestamps"
          git push origin HEAD:repair/nexus-atlas-integration-v1
