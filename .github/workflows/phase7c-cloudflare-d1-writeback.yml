name: Phase 7C Cloudflare D1 Write-back

on:
  pull_request:
    branches:
      - main
    paths:
      - 'experience/writeback-v01/cloudflare-d1-writeback-adapter.mjs'
      - 'migrations/phase7c-d1-writeback-v01.sql'
      - 'tests/cloudflare-d1-writeback-v01.test.mjs'
      - 'docs/Nexus-Atlas-v0.1-Cloudflare-D1-Writeback-Contract.md'
      - 'docs/Nexus-Atlas-v0.1-Cloudflare-D1-Writeback-Test-Matrix.md'
      - '.github/workflows/phase7b-writeback-target-policy.yml'
      - '.github/workflows/phase7c-cloudflare-d1-writeback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-d1-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Phase 7C syntax boundary
        run: |
          node --check experience/writeback-v01/cloudflare-d1-writeback-adapter.mjs
          node --check tests/cloudflare-d1-writeback-v01.test.mjs

      - name: Dedicated Phase 7C acceptance
        run: node --test tests/cloudflare-d1-writeback-v01.test.mjs

      - name: Validate tracked schema parity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { D1_WRITEBACK_SCHEMA_SQL_V01 } from './experience/writeback-v01/cloudflare-d1-writeback-adapter.mjs';
          const normalize = value => value.replace(/\s+/g, ' ').trim();
          const tracked = fs.readFileSync('migrations/phase7c-d1-writeback-v01.sql', 'utf8');
          if (normalize(tracked) !== normalize(D1_WRITEBACK_SCHEMA_SQL_V01)) {
            throw new Error('tracked D1 schema and runtime initializer schema differ');
          }
          NODE

      - name: Enforce bounded Phase 7C changed scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --depth=1
          allowed='^(experience/writeback-v01/cloudflare-d1-writeback-adapter\.mjs|migrations/phase7c-d1-writeback-v01\.sql|tests/cloudflare-d1-writeback-v01\.test\.mjs|docs/Nexus-Atlas-v0\.1-Cloudflare-D1-Writeback-(Contract|Test-Matrix)\.md|\.github/workflows/phase7b-writeback-target-policy\.yml|\.github/workflows/phase7c-cloudflare-d1-writeback\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Phase 7C modified files outside the accepted bounded scope:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Fxq 'wrangler.toml'; then
            echo 'Phase 7C must not provision a production D1 binding.' >&2
            exit 1
          fi

      - name: Phase 7B target/policy regression
        run: node --test tests/writeback-target-policy-v01.test.mjs

      - name: Phase 6B checkpoint persistence regression
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 6C fresh evidence and assessment regression
        run: node --test tests/fresh-evidence-window-v01.test.mjs tests/continuity-assessment-v01.test.mjs

      - name: Phase 6D authority and re-entry regression
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6E outcome verification regression
        run: node --test tests/outcome-verification-v01.test.mjs

      - name: Phase 6F continuity closure regression
        run: node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01
