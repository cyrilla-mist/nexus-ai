name: Phase 6G Adversarial + Real Run

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/phase6g-real-run.mjs'
      - 'evaluation/phase6g/**'
      - 'docs/Nexus-Atlas-Phase6G-Adversarial-Evaluation.md'
      - '.github/workflows/phase6g-real-run.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/phase6g-real-run.mjs'
      - 'evaluation/phase6g/**'
      - 'docs/Nexus-Atlas-Phase6G-Adversarial-Evaluation.md'
      - '.github/workflows/phase6g-real-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: node --version

      - name: Phase 6G syntax boundary
        run: node --check scripts/phase6g-real-run.mjs

      - name: Phase 6B checkpoint and persistence adversarial coverage
        run: node --test tests/trusted-checkpoint-v01.test.mjs tests/file-trusted-checkpoint-store-v01.test.mjs

      - name: Phase 6C fresh evidence and assessment adversarial coverage
        run: node --test tests/fresh-evidence-window-v01.test.mjs tests/continuity-assessment-v01.test.mjs

      - name: Phase 6D authority adversarial coverage
        run: node --test tests/human-authority-reentry-v01.test.mjs

      - name: Phase 6E outcome adversarial coverage
        run: node --test tests/outcome-verification-v01.test.mjs

      - name: Phase 6F closure adversarial coverage
        run: node --test tests/continuity-closure-v01.test.mjs

      - name: Phase 5 frozen regression
        run: npm run verify:phase5-v01

      - name: Phase 4 frozen regression
        run: npm run verify:phase4-v01

  real-run:
    needs: adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read real-run stage
        id: state
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("evaluation/phase6g/real-run/manifest.json","utf8")); console.log(`stage=${m.stage}`); console.log(`pre_action_run_id=${m.preActionRunId ?? ""}`);' >> "$GITHUB_OUTPUT"

      - name: Execute pre-action trusted re-entry
        if: github.event_name == 'pull_request' && steps.state.outputs.stage == 'pre-action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/phase6g-real-run.mjs pre-action --out .phase6g/pre

      - name: Upload pre-action evidence
        if: github.event_name == 'pull_request' && steps.state.outputs.stage == 'pre-action'
        uses: actions/upload-artifact@v4
        with:
          name: phase6g-pre-action
          path: .phase6g/pre
          if-no-files-found: error
          retention-days: 30

      - name: Require armed post-action run id
        if: github.event_name == 'push' && steps.state.outputs.stage == 'armed'
        shell: bash
        run: |
          if [ -z "${{ steps.state.outputs.pre_action_run_id }}" ]; then
            echo "manifest.preActionRunId is required for the post-action stage" >&2
            exit 1
          fi

      - name: Download exact pre-action evidence
        if: github.event_name == 'push' && steps.state.outputs.stage == 'armed'
        uses: actions/download-artifact@v4
        with:
          name: phase6g-pre-action
          path: .phase6g/pre
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.state.outputs.pre_action_run_id }}

      - name: Execute post-action fresh verification and closure
        if: github.event_name == 'push' && steps.state.outputs.stage == 'armed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/phase6g-real-run.mjs post-action --pre .phase6g/pre --out .phase6g/final

      - name: Upload replayable real-run evidence
        if: github.event_name == 'push' && steps.state.outputs.stage == 'armed'
        uses: actions/upload-artifact@v4
        with:
          name: phase6g-real-run
          path: .phase6g/final
          if-no-files-found: error
          retention-days: 30
