name: Apply Stable Governance Actions

on:
  push:
    branches:
      - repair/nexus-atlas-integration-v1
    paths:
      - scripts/apply-stable-governance-actions.mjs
      - .github/workflows/apply-stable-governance-actions.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/nexus-atlas-integration-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply stable governance attributes
        run: node scripts/apply-stable-governance-actions.mjs

      - name: Validate migrated contracts
        run: |
          npm test
          npm run check
          npm run verify:security-contracts
          npm run verify:verity-continuity

      - name: Commit migrated frontend
        run: |
          if git diff --quiet; then
            echo "No governance migration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/continuity/reentry.js
          git commit -m "fix: bind Re-entry governance to stable action IDs"
          git push origin HEAD:repair/nexus-atlas-integration-v1
