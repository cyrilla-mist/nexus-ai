<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexus AI Continuity workspace with fixture and local DataHub MCP live-read modes."
    />
    <title>Nexus AI · Continuity Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./frontend/continuity/reentry.css" />
  </head>
  <body>
    <div class="paper-texture" aria-hidden="true"></div>
    <header class="report-masthead">
      <a class="wordmark" href="./reentry.html#brief" aria-label="Nexus Continuity Workspace">
        <span aria-hidden="true">◆</span>
        <strong>NEXUS</strong>
      </a>
      <p>CONTINUITY WORKSPACE <span>v0.9.6.1 Prototype</span></p>
      <div class="masthead-meta">
        <time id="report-date">30 JUL 2026</time>
        <span id="continuity-source-label">Continuity fixture</span>
        <span id="continuity-source-detail">Runtime mapping verified</span>
      </div>
    </header>

    <div class="report-layout">
      <aside class="report-rail">
        <p class="rail-label">CONTINUITY ENGINE</p>
        <nav class="workspace-tabs" aria-label="Continuity workspaces" role="tablist">
          <button id="tab-brief" type="button" role="tab" aria-controls="reentry-app" aria-selected="true" tabindex="0" data-workspace="brief">
            <span>01</span>
            <strong><span class="tab-full">RE-ENTRY BRIEF</span><span class="tab-short">BRIEF</span></strong>
          </button>
          <button id="tab-evidence" type="button" role="tab" aria-controls="reentry-app" aria-selected="false" tabindex="-1" data-workspace="evidence">
            <span>02</span>
            <strong><span class="tab-full">EVIDENCE &amp; CONFLICT</span><span class="tab-short">EVIDENCE</span></strong>
          </button>
          <button id="tab-memory" type="button" role="tab" aria-controls="reentry-app" aria-selected="false" tabindex="-1" data-workspace="memory">
            <span>03</span>
            <strong><span class="tab-full">MEMORY LEDGER</span><span class="tab-short">MEMORY</span></strong>
          </button>
          <button id="tab-action" type="button" role="tab" aria-controls="reentry-app" aria-selected="false" tabindex="-1" data-workspace="action">
            <span>04</span>
            <strong><span class="tab-full">DECISION &amp; ACTION</span><span class="tab-short">ACTION</span></strong>
          </button>
        </nav>
        <dl class="rail-project">
          <div><dt>PROJECT</dt><dd id="rail-project-name">Nexus AI</dd></div>
          <div><dt>STATUS</dt><dd id="rail-project-status">Recovering context</dd></div>
          <div><dt>SOURCE</dt><dd id="rail-project-source">Development fixture</dd></div>
        </dl>
      </aside>

      <main
        id="continuity-workspace"
        class="report-main"
        data-continuity-bridge-url="http://127.0.0.1:8789/api/continuity/reentry"
      >
        <h1 class="visually-hidden">Nexus AI Continuity Workspace</h1>
        <div id="reentry-status" class="load-state" role="status">
          Recovering project context…
        </div>
        <div id="reentry-app" role="tabpanel" aria-labelledby="tab-brief" tabindex="0" hidden></div>
        <p id="workspace-announcement" class="visually-hidden" aria-live="polite"></p>
      </main>
    </div>

    <script type="module" src="./frontend/continuity/reentry.js"></script>
  </body>
</html>
