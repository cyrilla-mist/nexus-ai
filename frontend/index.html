<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexus AI Project Atlas — 从想法到可执行项目。"
    />
    <!--
      生产部署时可将 content 改为真实 Worker 地址。
      留空时：localhost 使用 8787；生产环境使用同源 /api/nexus。
    -->
    <meta name="nexus-api-endpoint" content="" />
    <title>Nexus AI · Project Atlas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Nexus AI · Project Atlas</p>
        <h1>让一个想法，<span>逐步成为项目。</span></h1>
        <p class="hero-copy">
          Nexus Core 会理解你的目标，Project Atlas 会通过有限轮次的澄清，
          帮你形成更清晰的项目画像、蓝图、风险判断和下一步行动。
        </p>
      </header>

      <section class="workspace" aria-labelledby="workspace-title">
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">Project Workspace</p>
            <h2 id="workspace-title">从一个想法开始</h2>
          </div>
          <div class="status-group" aria-label="系统状态">
            <span class="model-pill" id="model-mode" data-mode="mock">
              Mock Mode
            </span>
            <span class="status-pill" id="system-status">待输入</span>
          </div>
        </div>

        <label for="idea-input">告诉 Nexus 你想完成什么</label>
        <textarea
          id="idea-input"
          rows="6"
          placeholder="例如：我想做一个帮助大学生管理学习任务的 AI 项目，先完成网页版 MVP。"
        ></textarea>

        <div class="actions">
          <button id="submit-button" type="button">开始分析</button>
          <button id="clear-button" class="secondary" type="button">清空</button>
        </div>

        <p class="helper" id="connection-hint"></p>
      </section>

      <section
        class="result"
        aria-live="polite"
        aria-busy="false"
        aria-labelledby="result-title"
      >
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">Nexus Output</p>
            <h2 id="result-title">项目协作结果</h2>
          </div>
          <span class="turn-pill" id="turn-indicator" hidden></span>
        </div>

        <div id="feedback-banner" class="feedback-banner" hidden></div>

        <div id="empty-state" class="empty-state">
          输入想法后，这里会显示项目阶段、项目画像、Blueprint、风险和下一步行动。
        </div>

        <div id="result-content" hidden></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
